<div class="container">
  <h3 mat-dialog-title>Está seguro?</h3>
  <div mat-dialog-content>
    <ul class="delete-list">
      <li>
        <p><span class="font-weight-bold"> Name: </span>{{data.nombres}} {{data.nombres}}</p>
      </li>
      <li>
        <p><span class="font-weight-bold"> Email: </span>{{ data.email }}</p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">Mobile: </span>{{data.telefono}}
        </p>
      </li>
    </ul>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button mat-flat-button class="formCancelBtn" (click)="confirmDelete()">
      Delete
    </button>
    <button mat-flat-button mat-dialog-close color="accent" tabindex="-1">Cancel</button>
  </div>
</div>
