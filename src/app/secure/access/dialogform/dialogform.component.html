<div class="create-role-dialog">
  <div class="role-dialog-header">
    <span class="role-dialog-icon" aria-hidden="true">
      <mat-icon>admin_panel_settings</mat-icon>
    </span>

    <div class="role-dialog-title">
      <h2>{{ 'MENUITEMS.SECURE.CREATEROL' | translate }}</h2>
      <p>{{ 'MENUITEMS.SECURE.ROLE_ASSIGNED_TO' | translate: { organization: organizationName } }}</p>
    </div>

    <button
      mat-icon-button
      type="button"
      [disabled]="isSaving"
      [attr.aria-label]="'MENUITEMS.SECURE.CANCEL' | translate"
      (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="addCusForm" (ngSubmit)="onSubmitClick()">
    <div mat-dialog-content class="role-dialog-content">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ 'MENUITEMS.SECURE.ROLE_NAME' | translate }}</mat-label>
        <input matInput formControlName="Nombre" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ 'MENUITEMS.SECURE.ROLE_DESC' | translate }}</mat-label>
        <input matInput formControlName="Descripcion" required />
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end" class="role-dialog-actions">
      <button type="button" mat-button [disabled]="isSaving" (click)="closeDialog()">
        {{ 'MENUITEMS.SECURE.CANCEL' | translate }}
      </button>
      <button
        type="submit"
        mat-raised-button
        color="primary"
        [disabled]="addCusForm.invalid || idOrganization <= 0 || isSaving">
        <mat-icon>{{ isSaving ? 'sync' : 'save' }}</mat-icon>
        {{ 'MENUITEMS.SECURE.SAVE' | translate }}
      </button>
    </div>
  </form>
</div>
