<section class="content">
  <div  class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'MENUITEMS.SECURE.ACCESS' | translate" [items]="['Home','CONFIGURACION']" [active_item]="'Accesos '"></app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-12">
        <div  class="card">
          <div class="header">
         
            <button style="margin-left: auto; border-radius: 8px;" mat-raised-button color="primary" (click)="openDialogNewRol()">
              <mat-icon>add</mat-icon> {{ 'MENUITEMS.SECURE.CREATEROL' | translate }}
            </button>
            
          </div>
          <div class="body">
            <div
              *ngIf="isLoadingRoles"
              class="roles-loading-state"
              role="status"
              [attr.aria-label]="'MENUITEMS.SECURE.LOADING_ROLES' | translate">
              <mat-progress-spinner
                mode="indeterminate"
                [diameter]="42">
              </mat-progress-spinner>
            </div>

            <mat-accordion *ngIf="!isLoadingRoles">
              
              <mat-expansion-panel *ngFor="let role of rolesAccess">
                <mat-expansion-panel-header>
                  <mat-panel-title>Rol [{{ role.roleName }}]</mat-panel-title>
                  <mat-panel-description>{{ role.Description }}</mat-panel-description>
                </mat-expansion-panel-header>

                <div class="table-responsive">
                  <table class="table">
                    <tbody>
                      <tr *ngFor="let access of role.accesses">
                        <!-- Nombre y descripción -->
                        <td>
                          <strong>{{ access.actionName | translate}}</strong><br/>
                          <small class="text-muted">{{ access.actionDescription | translate }}</small>
                        </td>
                        <!-- Toggle alineado a la derecha -->
                        <td class="text-end">
                          <mat-slide-toggle
                            [checked]="access.hasAccess === 1"
                            (change)="onToggleAccess(role.RoleId, access.ActionId, $event.checked)"
                            [disabled]="role.roleName?.toLowerCase() === 'admin'">
                          </mat-slide-toggle>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

              </mat-expansion-panel>
            </mat-accordion>



           

            

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
