<div class="dialogContainer">
  <div class="modalHeader">
    <div class="modalTitle">
      {{ dialogTitle }}
    </div>

    <button
      mat-icon-button
      mat-dialog-close
      class="modal-close-button"
      aria-label="Close dialog"
      type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content>
    <form class="form-field-full" [formGroup]="configForm" (ngSubmit)="submit()">
      <div class="row m-b-25">
        <div class="col-sm-3">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>ID</mat-label>
            <input matInput formControlName="IdConfig" />
            <mat-icon matSuffix>tag</mat-icon>
          </mat-form-field>
        </div>

        <div class="col-sm-9">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="Nombre" />
            <mat-icon matSuffix>tune</mat-icon>
            <mat-error *ngIf="configForm.get('Nombre')?.hasError('required')">
              Nombre es requerido
            </mat-error>
            <mat-error *ngIf="configForm.get('Nombre')?.hasError('maxlength')">
              Nombre no debe superar 100 caracteres
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="row m-b-25">
        <div class="col-sm-12">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Valor</mat-label>
            <textarea matInput formControlName="Valor" rows="4"></textarea>
            <mat-icon matSuffix>data_object</mat-icon>
            <mat-error *ngIf="configForm.get('Valor')?.hasError('required')">
              Valor es requerido
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="row m-b-25">
        <div class="col-sm-12">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="Descripcion" rows="3"></textarea>
            <mat-icon matSuffix>notes</mat-icon>
          </mat-form-field>
        </div>
      </div>

      <div class="row m-b-25">
        <div class="col-sm-12 status-field">
          <mat-slide-toggle formControlName="Estado" color="primary">
            Activo
          </mat-slide-toggle>
        </div>
      </div>

      <div class="row m-b-25">
        <div class="col-sm-12 text-end">
          <button mat-flat-button color="primary" [disabled]="configForm.invalid" type="submit">
            Guardar
          </button>
          <button
            style="margin-left: 10px"
            mat-flat-button
            mat-dialog-close
            color="warn"
            type="button">
            Cancelar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
