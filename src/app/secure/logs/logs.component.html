 <section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Logs de Ingtegraciones'" [items]="['Home','Tables']" [active_item]="'ngx Datatable'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="body">
            <div class="row">
              <div class="col-sm-12">
                
                <div class="right">
                  <ul class="tbl-export-btn">
                    <li class="tbl-header-btn">
                      <div class="export-button m-l-10">
                        <button mat-icon-button (click)="exportExcel()" class="col-blue" matTooltip="Xlsx Download">
                          <mat-icon class="material-icons-outlined">file_download</mat-icon>
                        </button>
                      </div>
                    </li>
              
                  </ul>
                 
                </div>
                <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
                <!-- Genera dinámicamente un <ng-container> por cada columna visible -->
                <ng-container *ngFor="let col of columnDefinitions" [matColumnDef]="col.def">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>
                    <span class="truncate-text">{{ getLabel(col.def) }}</span>
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <span class="mobile-label">{{ getLabel(col.def) }}:</span>
                    
                    <!-- Primero: caso especial Resultado -->
                    <ng-container *ngIf="col.def === 'Resultado'; else otherCells">
                      <span
                        class="badge"
                        [ngClass]="row.Resultado === 'Enviado'
                          ? 'badge-solid-green'
                          : 'badge-solid-red'">
                        {{ row.Resultado }}
                      </span>
                    </ng-container>
                    
                    <!-- Resto de casos -->
                    <ng-template #otherCells>
                      <!-- Boolean -->
                      <ng-container *ngIf="col.type === 'boolean'; else notBoolean">
                        {{ row[col.def] ? 'Sí' : 'No' }}
                      </ng-container>
                      <ng-template #notBoolean>
                        <!-- Datetime -->
                        <ng-container *ngIf="col.type === 'datetime'; else plainText">
                          {{ row[col.def] | date:'short' }}
                        </ng-container>
                        <ng-template #plainText>
                          <span class="truncate-text">{{ row[col.def] }}</span>
                        </ng-template>
                      </ng-template>
                    </ng-template>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
                <tr mat-row (click)="editCall(row)" [style.cursor]="'pointer'" *matRowDef="let row; columns: getDisplayedColumns();"></tr>
              
              </table>

                   
                    

                    
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
  </div>
</section>
