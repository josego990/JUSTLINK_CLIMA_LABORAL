<table mat-table [dataSource]="subjects" class="mat-elevation-z8">

  <!-- Subject Column -->
  <ng-container matColumnDef="subject">
    <th mat-header-cell *matHeaderCellDef>Pregunta</th>
    <td mat-cell *matCellDef="let subject">{{ subject.subject }}</td>
  </ng-container>

  <ng-container matColumnDef="factor">
    <th mat-header-cell *matHeaderCellDef>Factor</th>
    <td mat-cell *matCellDef="let subject">
      {{subject.factor}}
    </td>
  </ng-container>


  <ng-container matColumnDef="totacuerdo">
    <th mat-header-cell *matHeaderCellDef>Muy de acuerdo</th>
    <td mat-cell *matCellDef="let subject">
      {{subject.totacuerdo}}
    </td>
  </ng-container>
  <ng-container matColumnDef="acuerdo">
    <th mat-header-cell *matHeaderCellDef>De acuerdo</th>
    <td mat-cell *matCellDef="let subject">
      {{subject.acuerdo}}
    </td>
  </ng-container>
  <ng-container matColumnDef="desacuerdo">
    <th mat-header-cell *matHeaderCellDef>En desacuerdo</th>
    <td mat-cell *matCellDef="let subject">
      {{subject.desacuerdo}}
    </td>
  </ng-container>
  <ng-container matColumnDef="totdesacuerdo">
    <th mat-header-cell *matHeaderCellDef>Muy en desacuerdo</th>
    <td mat-cell *matCellDef="let subject">
      {{subject.totdesacuerdo}}
    </td>
  </ng-container>

  <!-- Progress Column -->
  <ng-container matColumnDef="progress">
    <th mat-header-cell *matHeaderCellDef>Satisfacción</th>
    <td mat-cell *matCellDef="let subject">
      {{ subject.progress }}%
      <mat-progress-bar
        mode="determinate"
        [value]="subject.progress"
        [style.--mdc-linear-progress-active-indicator-color]="getColor(subject.progress)">
      </mat-progress-bar>

        
        

    </td>
  </ng-container>

 


  
  

  <!-- Duration Column -->
  <ng-container matColumnDef="duration">
    <th mat-header-cell *matHeaderCellDef>Respuestas</th>
    <td mat-cell *matCellDef="let subject">{{ subject.duration }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef=     "['subject', 'factor','totacuerdo','acuerdo','desacuerdo','totdesacuerdo', 'progress', 'duration']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['subject', 'factor','totacuerdo','acuerdo','desacuerdo','totdesacuerdo', 'progress', 'duration'];"></tr>
</table>
