<div>
  <h2 mat-dialog-title>Crear Nuevo Clima Laboral</h2>
  <div mat-dialog-content>

    <mat-tab-group>

        <form style="margin-top: 5px" [formGroup]="addCusForm!" (ngSubmit)="onSubmitClick()"> 


          <div  class="row">
          
            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Organización</mat-label>
                  <mat-select (selectionChange)="onOrganizationChange($event)">
                    <mat-option
                      *ngFor="let organization of dataSourceOrganizations" 
                      [value]="organization.Id"
                    >
                      {{ organization.Nombre }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>                
            </div>

            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">
              <div class="text-inside">
                <mat-form-field class="example-full-width" appearance="fill">
                  <mat-label>Seleccione el tipo de Evaluación</mat-label>
                  <mat-select >

                    <mat-option value="1">Escala de Likert</mat-option>


                  </mat-select>
                </mat-form-field> 
              </div>
            </div>
       
            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">          
              <div class="text-inside">
                <mat-form-field class="example-full-width" appearance="outline">
                <mat-label>Nombre del clima</mat-label>
                <input matInput value={{qname}} formControlName="quizName" required>
                <mat-error *ngIf="addCusForm.controls?.['quizName']?.hasError('required')">
                  Por favor ingrese el nombre del clima!
                </mat-error>
                </mat-form-field>
              </div>
            </div>
                   
          </div>

          
          <div class="row">              
            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2"> 
              <div class="text-inside">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Descripción</mat-label>
                  <input matInput value={{qdesc}} formControlName="quizDesc" required>
                  <mat-error *ngIf="addCusForm.controls?.['quizDesc']?.hasError('required')">
                    Por favor ingrese una descripción
                  </mat-error>
                </mat-form-field>
              </div>
            </div>

            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
              <div class="text-inside">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Url Imágen</mat-label>
                  <input matInput formControlName="urlImg" required>
                  <mat-error *ngIf="addCusForm.controls?.['urlImg']?.hasError('required')">
                    Por favor ingrese una URL de imágen.
                  </mat-error>
                </mat-form-field>
              </div>
            </div>

            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">

                  <mat-label>Vigente desde</mat-label>
                  <input matInput [owlDateTimeTrigger]="date1" [owlDateTime]="date1" formControlName="startDate">
                  <mat-icon matSuffix [owlDateTimeTrigger]="date1" class="date-icon">today</mat-icon>
                  <owl-date-time #date1></owl-date-time>
                </mat-form-field>
              </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">
              <div class="text-inside">
                <mat-form-field class="example-full-width mb-3">
                  <mat-label>Vigente hasta</mat-label>
                  <input matInput [owlDateTimeTrigger]="date2" [owlDateTime]="date2" formControlName="endDate">
                  <mat-icon matSuffix [owlDateTimeTrigger]="date2" class="date-icon">today</mat-icon>
                  <owl-date-time #date2></owl-date-time>
                </mat-form-field>
              </div>
            </div>

                  <mat-label>Score</mat-label>

                    Por favor ingrese un valor numérico para la ponderación.
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            -->
            
          </div>
    
          
          <div class="btn-sec">
            <button type="submit" class="btn-space" mat-raised-button color="primary">Guardar</button>
            <button style="color:#91a1a4;" type="button" mat-button (click)="closeDialog()">Cancelar</button>
          </div>
        </form>
