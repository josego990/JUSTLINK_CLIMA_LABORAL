<div >
    <h1 mat-dialog-title>{{'MENUITEMS.QUIZ.ADDGRANDFACTORTITLE' | translate}}</h1>
    <form id="form_textarea" [formGroup]="addSerieForm!" style="margin-left: 20px; margin-right: 20px;">
      

      <div class="row">
        <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>{{'MENUITEMS.QUIZ.GRANDFACTORNAME' | translate}}</mat-label>
              <input matInput formControlName="iname" required>
              <mat-error *ngIf="addSerieForm.controls?.['iname']?.hasError('required')">
                {{'MENUITEMS.QUIZ.INSERTGRANDFACTORNAME' | translate}}
              </mat-error>
            </mat-form-field>
        </div>
        <div class="col-xl-8 col-lg-8 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>{{'MENUITEMS.QUIZ.GRANDFACTORDESC' | translate}}</mat-label>
            <input matInput formControlName="idesc" required>
            <mat-error *ngIf="addSerieForm.controls?.['idesc']?.hasError('required')">
              {{'MENUITEMS.QUIZ.INSERTGRANDFACTORDESC' | translate}}
            </mat-error>
          </mat-form-field> 
        </div>
      </div>
     
      <div mat-dialog-actions>
        <button class="btn-space" mat-raised-button color="primary" 
        style="border-radius: 5px;" [disabled]="loading" (click)="guardaGFactor()">{{'MENUITEMS.QUIZ.SAVE' | translate}}</button>
        <button style="color:#91a1a4; border-radius: 5px;" type="button" mat-button (click)="closeDialog()">{{'MENUITEMS.QUIZ.CLOSE' | translate}}</button>
      </div>
    </form>
    <mat-progress-spinner
      *ngIf="loading"
      mode="indeterminate"
      diameter="40"
      color="primary"
      style="margin: auto; display: block;">
    </mat-progress-spinner>
  </div>
