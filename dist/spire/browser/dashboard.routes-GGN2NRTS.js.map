<mat-card>
  <mat-card-header>
    <mat-card-title>Participación por factor demográfico</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Selector de campo para el donut -->
    <div class="row">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Campo demográfico</mat-label>
        <mat-select [value]="selectedCampo()" (selectionChange)="selectedCampo.set($event.value)">
          <mat-option *ngFor="let c of campos()" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Donut por campo -->
    <div class="chart-wrap" *ngIf="donutOptions().series?.length">
      <apx-chart
        [series]="donutOptions().series!"
        [chart]="donutOptions().chart!"
        [labels]="donutOptions().labels!"
        [legend]="donutOptions().legend!"
        [dataLabels]="donutOptions().dataLabels!"
        [title]="donutOptions().title!"
        [responsive]="donutOptions().responsive!"
        [tooltip]="donutOptions().tooltip!"
      ></apx-chart>
    </div>

    <mat-divider class="my-20"></mat-divider>

    <!-- Stacked 100% (todos los campos) -->
    <div class="chart-wrap" *ngIf="stackedOptions().series?.length">
      <apx-chart
        [series]="stackedOptions().series!"
        [chart]="stackedOptions().chart!"
        [xaxis]="stackedOptions().xaxis!"
        [yaxis]="stackedOptions().yaxis!"
        [plotOptions]="stackedOptions().plotOptions!"
        [legend]="stackedOptions().legend!"
        [stroke]="stackedOptions().stroke!"
        [dataLabels]="stackedOptions().dataLabels!"
        [grid]="stackedOptions().grid!"
        [title]="stackedOptions().title!"
        [tooltip]="stackedOptions().tooltip!"
      ></apx-chart>
    </div>
  </mat-card-content>
</mat-card>
